'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euro=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n/100), amount=n=>n===null?'':(n/100).toFixed(2), date=()=>new Date().toLocaleDateString('sv-SE'), uid=()=>crypto.randomUUID();
let state=null,key=null,salt=null,db=null,view='orders',selected=null,persistChain=Promise.resolve(),lastActivity=Date.now(),saving=false,storageError=false;
const statuses=['Anfrage','Angebot','Freigegeben','Druckdaten prüfen','Bereit für Druck','Gedruckt','Transferieren','Fertig','Versendet / abgeholt','Storniert'];
function toast(t){const status=$('#modalStatus');if($('#modal')?.open&&status){status.textContent=t;status.hidden=false;status.scrollIntoView?.({block:'nearest'});}$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').hidden=true,6500);}
function fail(e){console.error(e);toast(e.message||String(e));}
function act(fn){return async e=>{try{await fn(e)}catch(x){fail(x)}};}
function bind(id,event,fn){const e=$(id);if(e)e.addEventListener(event,act(fn));}
function button(id,text,cls=''){return `<button id="${id}" class="${cls}" type="button">${text}</button>`;}
function input(name,label,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`;}
function textfield(name,label,value=''){return `<label>${label}<textarea name="${name}">${esc(value)}</textarea></label>`;}
function select(name,label,opts,value){return `<label>${label}<select name="${name}">${opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(value)?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;}
function formData(f){return Object.fromEntries(new FormData(f));}
function modal(html,fn){$('#modal').innerHTML=`<div class="row spread"><h2>${html.title}</h2>${button('closeModal','Schließen')}</div><p id="modalStatus" class="notice" role="alert" hidden></p>${html.body}`;$('#modal').showModal();bind('#closeModal','click',()=>$('#modal').close());if(fn)fn();}
function b64(a){let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.slice(i,i+32768));return btoa(s);}
function un64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function derive(pass,s){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function seal(s,k=key,sa=salt){const iv=crypto.getRandomValues(new Uint8Array(12));const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(s)));return {format:'RehaTexstyleVault',version:1,kdf:'PBKDF2-SHA256',iterations:600000,salt:b64(sa),iv:b64(iv),data:b64(new Uint8Array(data))};}
async function unlockEnvelope(env,pass){if(env?.format!=='RehaTexstyleVault'||env.version!==1||env.iterations!==600000)throw Error('Kein unterstütztes RehaTexstyle-Projekt.');const sa=un64(env.salt);if(sa.length!==16||un64(env.iv).length!==12)throw Error('Beschädigte Projektdatei.');const k=await derive(pass,sa);let raw;try{raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(env.iv)},k,un64(env.data));}catch{throw Error('Passwort falsch oder Datei beschädigt.');}return {state:Core.validState(JSON.parse(new TextDecoder().decode(raw))),key:k,salt:sa};}
async function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open('RehaTexstylePilot',1);r.onupgradeneeded=()=>r.result.createObjectStore('vault');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function dbGet(){return new Promise((resolve,reject)=>{const r=db.transaction('vault').objectStore('vault').get('active');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
async function dbPut(env){return new Promise((resolve,reject)=>{const t=db.transaction('vault','readwrite');t.objectStore('vault').put(env,'active');t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error||Error('Speichern abgebrochen'));});}
function save(){if(!state)return Promise.resolve();for(const o of state.orders)syncApplication(o);state.rev++;state.changed=new Date().toISOString();const snapshot=structuredClone(state),k=key,sa=salt;saving=true;$('#saveState').textContent='Speichern …';persistChain=persistChain.catch(()=>{}).then(async()=>{await dbPut(await seal(snapshot,k,sa));storageError=false;$('#saveState').textContent='Lokal verschlüsselt gespeichert';}).catch(e=>{storageError=true;$('#saveState').textContent='Nicht gespeichert – Sicherung erstellen!';throw Error('Lokales Speichern fehlgeschlagen: '+e.message);}).finally(()=>saving=false);return persistChain;}
async function download(data,name,type){const chosen=prompt('Dateiname vor dem Speichern:',name);if(!chosen)return false;const filename=chosen.replace(/[\\/:*?"<>|]/g,'_');const blob=new Blob([data],{type});if(window.showSaveFilePicker){try{const h=await window.showSaveFilePicker({suggestedName:filename});const w=await h.createWritable();await w.write(blob);await w.close();toast('Datei gespeichert.');return true;}catch(e){if(e.name==='AbortError')return false;if(e.name!=='SecurityError')throw e;}}const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000);toast('Download angefordert. Den Zielordner bestimmt dieser Browser.');return true;}

async function parseXlsx(file){if(file.size>15*1024*1024)throw Error('Excel-Datei größer als 15 MB.');const z=await JSZip.loadAsync(await file.arrayBuffer());const parse=s=>{const d=new DOMParser().parseFromString(s,'application/xml');if(d.querySelector('parsererror'))throw Error('Ungültiges Excel-XML.');return d;};const get=async n=>{const f=z.file(n);if(!f)throw Error('Excel-Bestandteil fehlt: '+n);const s=await f.async('string');if(s.length>30e6)throw Error('Excel-Inhalt zu groß.');return parse(s);};const ss=z.file('xl/sharedStrings.xml')?Array.from((await get('xl/sharedStrings.xml')).getElementsByTagName('si')).map(x=>Array.from(x.getElementsByTagName('t')).map(t=>t.textContent).join('')):[];const wb=await get('xl/workbook.xml'),rels=await get('xl/_rels/workbook.xml.rels');const sheet=Array.from(wb.getElementsByTagName('sheet')).find(s=>s.getAttribute('name')==='EU');if(!sheet)throw Error('Diese Version erwartet das HAKRO-Tabellenblatt EU. Andere Tabellenformate sind noch nicht unterstützt.');const rid=sheet.getAttribute('r:id'),rel=Array.from(rels.getElementsByTagName('Relationship')).find(x=>x.getAttribute('Id')===rid);if(!rel)throw Error('Tabellenblatt nicht gefunden.');let target=rel.getAttribute('Target');target=target.startsWith('/')?target.slice(1):'xl/'+target;const xml=await get(target),rows=[];for(const row of xml.getElementsByTagName('row')){const cells=[];for(const c of row.getElementsByTagName('c')){const letters=c.getAttribute('r').replace(/\d/g,'');let index=0;for(const a of letters)index=index*26+a.charCodeAt(0)-64;const v=c.getElementsByTagName('v')[0]?.textContent??'';const type=c.getAttribute('t');if(c.getElementsByTagName('f').length)throw Error('Formelzelle gefunden. Diese Pilotversion importiert nur feste Preiswerte.');cells[index-1]=type==='s'?ss[Number(v)]:type==='inlineStr'?Array.from(c.getElementsByTagName('t')).map(t=>t.textContent).join(''):v;}rows.push({row:Number(row.getAttribute('r')),cells});}
const head=rows.find(r=>String(r.cells[0]).trim()==='Modell'&&String(r.cells[1]).trim()==='Modellbezeichnung');if(!head)throw Error('HAKRO-Kopfzeile nicht erkannt.');const h=head.cells.map(x=>String(x??'').trim()),dealer=h[4]==='1+'&&h[8]==='UVP';if(!dealer&&h[4]!=='UVP')throw Error('Preis-Spalten nicht eindeutig erkannt.');const out=[],ignored=[],problems=[],rounded=[];const keys=new Set();for(const {row,cells:c} of rows.filter(x=>x.row>head.row)){if(!/^\d{3,4}$/.test(String(c[0]??''))){if(c.some(Boolean))ignored.push(row);continue;}const model=String(c[0]).padStart(4,'0'),name=String(c[1]??''),colorText=String(c[2]??''),sizeText=String(c[3]??'');const colors=colorText.split(';').map(c=>c.trim()).filter(Boolean);const sz=Core.sizes(sizeText);if(!name||!colors.length||colors.some(c=>!/^\d{3}$/.test(c))||!sz.length){problems.push({row,reason:'Farbe oder Größenbereich nicht automatisch zuordenbar',model,sizeText});continue;}try{const rawPrices=c.slice(4).map(v=>String(v??''));if(rawPrices.some(v=>v!==''&&Number.isFinite(Number(v))&&Math.abs(Number(v)*100-Math.round(Number(v)*100))>0.000001))rounded.push(row);const prices={};if(dealer)[1,10,100,500].forEach((n,i)=>prices[n]=Core.excelCents(c[4+i]));const uvp=Core.excelCents(c[dealer?8:4]);const industry={};[10,50,100,250,500].forEach((n,i)=>industry[n]=Core.excelCents(c[(dealer?9:5)+i]));const k=JSON.stringify([model,[...colors].sort(),sizeText]);if(keys.has(k))throw Error('Doppelte Preiszeile');keys.add(k);out.push({id:uid(),model,name,colors,sizes:sz,sizeText,prices,uvp,industry,source:file.name,row,rawPrices});}catch(e){problems.push({row,reason:e.message,model,sizeText});}}
return {rows:out,ignored,problems,rounded,dealer};}

function catalogPage(){$('#app').innerHTML=`<h1>Artikel und Excel-Preislisten</h1><section class="card"><h2>HAKRO importieren</h2><p>Die Händler-Einkaufspreisliste enthält EK-Staffeln. Die reine UVP-/Industriepreisliste liefert die Industriepreise für den Netto-VK. Die UVP bleibt eine Referenz; sie wird nicht automatisch als VK oder EK übernommen.</p><label>Excel-Datei auswählen<input id="excelFile" type="file" accept=".xlsx"></label><div id="importResult"></div></section><section class="card"><label>Katalog durchsuchen<input id="catalogSearch" placeholder="Modellnummer oder Modellbezeichnung"></label><div id="catalogList"></div></section>`;const show=()=>{const q=$('#catalogSearch').value.toLowerCase(),rs=state.catalog.filter(r=>(r.model+' '+r.name).toLowerCase().includes(q));$('#catalogList').innerHTML=`<p>${rs.length} Preiszeilen · Anzeige der ersten 60. ${selected&&order()?'Zielauftrag: '+esc(order().number):'Zum Übernehmen Auftrag wählen.'}</p><div class="tablewrap"><table><tr><th>Modell</th><th>Artikel</th><th>Größen</th><th>Farben</th><th>EK ab 1</th><th>Aktion</th></tr>${rs.slice(0,60).map(r=>`<tr><td>${esc(r.model)}</td><td>${esc(r.name)}</td><td>${esc(r.sizeText)}</td><td>${esc(r.colors.join(';'))}</td><td>${r.prices[1]===undefined?'EK fehlt · Händlerliste importieren oder manuell eingeben':euro(r.prices[1])}</td><td><button data-catalog-add="${esc(r.id)}">Zum Auftrag hinzufügen</button></td></tr>`).join('')}</table></div>`;document.querySelectorAll('[data-catalog-add]').forEach(b=>b.onclick=()=>addCatalogRow(b.dataset.catalogAdd));};bind('#catalogSearch','input',show);show();bind('#excelFile','change',async e=>{const f=e.target.files[0];if(!f)return;$('#importResult').textContent='Datei wird lokal geprüft …';const r=await parseXlsx(f);const keyOf=x=>JSON.stringify([x.model,[...x.colors].sort(),x.sizeText]);let added=0,updated=0;for(const x of r.rows){if(state.catalog.some(y=>keyOf(y)===keyOf(x)))updated++;else added++;}$('#importResult').innerHTML=`<div class="notice">${r.rows.length} gültige Preiszeilen · ${r.ignored.length} Hinweis-/Fußzeilen übersprungen · ${r.problems.length} Zeilen benötigen manuelle Prüfung.</div><p>Einzelpreise werden für diese Pilot-Kalkulation auf Cent gerundet. ${r.rounded.length} Zeilen enthalten zusätzliche Nachkommastellen; die Rohwerte bleiben im Katalog erhalten.</p><p>${added} neue / ${updated} vorhandene Preiszeilen. Bestehende Auftragspreise bleiben unverändert.</p>${r.problems.length?`<details open><summary>Prüfbedarf</summary><ul>${r.problems.map(x=>`<li>Zeile ${x.row}, Modell ${esc(x.model)}, ${esc(x.sizeText)}: ${esc(x.reason)}</li>`).join('')}</ul></details>`:''}${button('confirmImport','Gültige Preiszeilen übernehmen','primary')}`;bind('#confirmImport','click',async()=>{for(const x of r.rows){const i=state.catalog.findIndex(y=>keyOf(y)===keyOf(x));if(i<0)state.catalog.push(x);else{if(!r.dealer){x.prices=state.catalog[i].prices;x.source=state.catalog[i].source;x.row=state.catalog[i].row;}state.catalog[i]={...x,id:state.catalog[i].id};}}await save();render();toast(`${r.rows.length} Preiszeilen übernommen. ${r.problems.length} Zeilen nicht importiert.`);});});}
async function imageData(file){
if(!file)throw Error('Bitte eine Motivdatei auswählen.');
if(file.size>8*1024*1024)throw Error('Motiv größer als 8 MB. Bitte kleinere Vorschau verwenden.');
let bytes;try{bytes=new Uint8Array(await file.arrayBuffer());}catch{throw Error('Datei konnte nicht gelesen werden. Bitte lokal speichern und erneut auswählen.');}
const starts=a=>a.every((v,i)=>bytes[i]===v);
const mime=starts([137,80,78,71,13,10,26,10])?'image/png':starts([255,216,255])?'image/jpeg':starts([82,73,70,70])&&[87,69,66,80].every((v,i)=>bytes[i+8]===v)?'image/webp':null;
if(!mime)throw Error('Keine unterstützte Bilddatei. Bitte PNG, JPG oder WebP verwenden; PDF und SVG werden noch nicht unterstützt.');
return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('Bilddatei konnte nicht geladen werden. Bitte erneut auswählen.'));r.readAsDataURL(new Blob([bytes],{type:mime}));});
}

function placementScale(p){const c=p.calibration;if(!c?.a||!c?.b||!c?.origin||!(c.mm>0))return null;const n=Math.hypot(c.b.x-c.a.x,c.b.y-c.a.y)/c.mm;return Number.isFinite(n)&&n>0?n:null;}
function placementStatus(p){return placementScale(p)?(p.calibration.confirmed&&p.backgrounds?.[p.side]?'Maßstab anhand eigener flacher Vorlage bestätigt':'Kalibriert – Maßhaltigkeit nicht bestätigt'):'Unkalibrierte Vorschau – nicht maßhaltig';}
function placementImage(p,id=''){if(!p.src)return '';const k=placementScale(p)||.4,c=p.calibration?.origin||{x:170,y:55},x=c.x+p.x*k,y=c.y+p.y*k,w=p.width*k,h=p.height*k;return `<image ${id?'id="'+id+'"':''} href="${esc(p.src)}" x="${x-w/2}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="none" transform="rotate(${p.rotation} ${x} ${y+h/2})"/>${id?`<rect x="${x-w/2}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#d94040" stroke-width="1.4" stroke-dasharray="4 3" pointer-events="none" transform="rotate(${p.rotation} ${x} ${y+h/2})"/>`:""}`;}
function placementGroup(p){return JSON.stringify([p.lineId||'',p.side,p.template,p.backgrounds?.[p.side]||'',p.calibration||null]);}
function placementPages(o){const groups=new Map();for(const p of o.placements){const k=placementGroup(p);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(p);}return [...groups.values()].map(ps=>{const p=ps[0],l=o.lines.find(l=>l.id===p.lineId);return `<section class="placement" style="break-before:page"><h2>Motiv- und Platzierungsansicht</h2><p>${esc(l?[l.description,l.model,l.color,l.size].filter(Boolean).join(' · '):'Keine Artikelposition zugeordnet')} · ${esc(p.side)}</p><svg viewBox="0 0 340 420" style="display:block;width:100%;height:320px">${garmentSvg(o.garment,p)}${ps.map(x=>placementImage(x)).join('')}</svg><p><strong>${esc(placementStatus(p))}</strong></p><p>Vorlage ${esc(p.backgrounds?.[p.side]?'Eigene Vorlage':({'sketch-shirt':'T-Shirt-Zeichnung','sketch-hoodie':'Hoodie-Zeichnung','sketch-jacket':'Jacken-Zeichnung'}[p.template]||p.template||'Eigene Vorlage'))} · ${esc(p.calibration?.source||'Maßquelle nicht angegeben')}. Ausgabe verkleinert, kein 1:1-Ausdruck.</p><table><tr><th>Motiv / Datei</th><th>Breite × Höhe</th><th>Position / Bezug</th></tr>${ps.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.width} × ${x.height} mm<br>${x.rotation}°</td><td>X ${x.x} / Y ${x.y} mm<br>${esc(x.reference)}</td></tr>`).join('')}</table><p>Position bezeichnet die horizontale Motivmitte und die Oberkante vor Drehung. Maße am Produktionstextil kontrollieren.</p></section>`;}).join('');}
function applicationPrice(q,r){Core.qty(q);Core.qty(r.threshold);return q>=r.threshold?r.high:r.low;}
function placementEditor(id){const o=order(),old=o.placements.find(x=>x.id===id),p=drawingPlacement(old||{id:uid(),name:'',src:'',side:'Vorderseite',reference:'Kragenansatz Mitte',x:0,y:80,width:100,height:60,rotation:0},o.garment);p.backgrounds||={};const textiles=o.lines.filter(l=>!l.salesGenerated&&l.kind!=='application');if(!old&&textiles.length===1)p.lineId=textiles[0].id;let mode=null,drag=null,loading=false;
modal({title:'Transfer platzieren',body:`<form id="placementForm"><label><strong>1. Druckmotiv laden (erscheint auf dem Shirt)</strong><input id="motifFile" type="file" accept=".png,.jpg,.jpeg,.webp"></label><p id="uploadStatus" role="status">PNG, JPG oder WebP · maximal 8 MB</p><div class="grid">${select('lineId','Textilposition / konkrete Größe',[['','Bitte zuordnen'],...textiles.map(l=>[l.id,[l.description,l.model,l.color,l.size].filter(Boolean).join(' · ')])],p.lineId||'')}${select('template','Textilzeichnung',[['sketch-shirt','T-Shirt · Konturzeichnung'],['sketch-hoodie','Hoodie · Konturzeichnung'],['sketch-jacket','Jacke · Konturzeichnung']],p.template||sketchKind(o.garment))}</div>${select('side','Druckseite',['Vorderseite','Rückseite','Ärmel links','Ärmel rechts','Andere'],p.side)}<div class="grid"><div><p id="backgroundWarning" class="notice" hidden></p><div id="backgroundActions" class="row" hidden>${button('useBackgroundAsMotif','Dieses Bild als Motiv verwenden')}${button('clearBackground','Shirtkontur wieder anzeigen')}</div><svg id="stage" viewBox="0 0 340 420" aria-label="Textil und Transfers"></svg><p id="scaleStatus" class="notice"></p><p id="calHelp">Motiv mit dem Finger verschieben. Links/rechts aus Sicht der tragenden Person. Konturen sind schematisch. Vorhandene Platzierungen nach dem Vorlagenwechsel prüfen.</p><details><summary>Erweitert: maßhaltiges Textilbild und Messbezug</summary><p>Nur für ein Foto oder Schnittbild des Textils. Das Druckmotiv oben unter „Druckmotiv laden“ auswählen.</p><label>Eigenes Textilbild – ersetzt die Konturzeichnung<input id="backgroundFile" type="file" accept=".png,.jpg,.jpeg,.webp"></label><p>Die Konturzeichnungen sind allgemeine Formen, keine maßhaltigen HAKRO-Schnitte. Zum Kalibrieren zwei Punkte einer bekannten Strecke markieren und den echten Abstand eingeben. Für bestätigte Maße eine eigene maßhaltige Vorlage der konkreten Größe laden.</p><div class="row">${button('pointA','1. Messpunkt A')}${button('pointB','2. Messpunkt B')}${button('origin','3. Nullpunkt')}</div>${input('distance','Echter Abstand A–B in mm',p.calibration?.mm||'','number','min="1" max="3000" step="0.1"')}${input('source','Maßquelle / Modell / Größe',p.calibration?.source||'')}${input('reference','Nullpunkt am Textil',p.reference,'text','required')}<label><input name="confirmed" type="checkbox" ${p.calibration?.confirmed?'checked':''}> Eigenes flaches Bild und Maße dieser Größe geprüft</label><p>Bestätigung nur bei eigener flacher Vorlage möglich. X nach rechts, Y nach unten. Bildschirmdarstellung und PDF sind keine 1:1-Ausgabe.</p></details></div><div>${input('name','Motivname / Dateiname',p.name,'text','required')}<div class="grid">${input('width','Motivbreite mm',p.width,'number','required min="1" max="1000" step="0.1"')}${input('height','Motivhöhe mm',p.height,'number','required min="1" max="1000" step="0.1"')}</div><label>Motivbreite in der Vorschau ändern <input id="widthSlider" type="range" min="10" max="400" step="1" value="${Math.min(400,Math.max(10,p.width))}"></label><p class="sub">Die Breite in mm bestimmt auch die Druckpreis-Größenklasse. Die Kontur ist schematisch; ohne Kalibrierung ist der Vergleich zum echten Textil nicht maßhaltig.</p><label><input name="ratio" type="checkbox" checked> Proportionen beibehalten</label><div class="grid">${input('x','X: Motivmitte ab Nullpunkt (mm)',p.x,'number','required min="-1500" max="1500" step="0.1"')}${input('y','Y: Oberkante ab Nullpunkt (mm)',p.y,'number','required min="-1500" max="1500" step="0.1"')}</div>${input('rotation','Drehung °',p.rotation,'number','required min="-180" max="180"')}<p id="ppi" class="sub"></p><p>Mehrere Motive: Platzierung speichern, anschließend weitere anlegen oder diese duplizieren.</p></div></div><div class="row"><button class="primary">Speichern</button>${old?button('duplicatePlacement','Als weiteres Motiv speichern')+button('removePlacement','Entfernen','danger'):''}</div></form>`},()=>{const f=$('#placementForm'),stage=$('#stage');let ratio=p.width/p.height;
const read=()=>{for(const n of ['width','height','x','y','rotation'])p[n]=Number(f.elements[n].value);for(const n of ['name','lineId','template','side','reference'])p[n]=f.elements[n].value;if(p.calibration){p.calibration.mm=Number(f.elements.distance.value);p.calibration.source=f.elements.source.value;p.calibration.confirmed=f.elements.confirmed.checked&&!!p.backgrounds[p.side];}};
const draw=()=>{read();const c=p.calibration,points=c?['a','b','origin'].filter(n=>c[n]).map(n=>`<circle cx="${c[n].x}" cy="${c[n].y}" r="4" fill="#db6a13"/><text x="${c[n].x+6}" y="${c[n].y}" font-size="12">${n==='origin'?'0':n.toUpperCase()}</text>`).join(''):'';const siblings=o.placements.filter(x=>x.id!==p.id&&placementGroup(x)===placementGroup(p));stage.innerHTML=garmentSvg(o.garment,p)+siblings.map(x=>placementImage(x)).join('')+placementImage(p,'motif')+points;const own=!!p.backgrounds[p.side];$('#backgroundWarning').hidden=!own;$('#backgroundActions').hidden=!own;$('#backgroundWarning').textContent=own?'Dieses Bild wurde als Textilbild geladen und ersetzt deshalb die Shirtkontur. Falls es dein Druckmotiv ist, klicke „Dieses Bild als Motiv verwenden“.':'';$('#widthSlider').value=Math.min(400,Math.max(10,Number.isFinite(p.width)?p.width:100));$('#scaleStatus').textContent=placementStatus(p);$('#ppi').textContent=p.pixels&&p.width>0?`Datei: ${p.pixels[0]} × ${p.pixels[1]} Pixel · ${Math.round(p.pixels[0]*25.4/p.width)} ppi bei dieser Breite`:'';};
const reset=()=>{p.calibration=null;f.elements.confirmed.checked=false;f.elements.distance.value='';f.elements.source.value='';mode=null;$('#calHelp').textContent='Ansicht geändert. Maßstab und Nullpunkt neu einrichten.';draw();};
for(const n of ['template','side','lineId'])bind('[name='+n+']','change',reset);
f.addEventListener('input',e=>{if(e.target.id==='widthSlider'){f.elements.width.value=e.target.value;if(f.elements.ratio.checked&&Number.isFinite(ratio)&&ratio>0)f.elements.height.value=(Number(e.target.value)/ratio).toFixed(1);draw();return;}if(f.elements.ratio.checked&&['width','height'].includes(e.target.name)){if(e.target.name==='width')f.elements.height.value=(Number(e.target.value)/ratio).toFixed(1);else f.elements.width.value=(Number(e.target.value)*ratio).toFixed(1);}else if(['width','height'].includes(e.target.name))ratio=Number(f.elements.width.value)/Number(f.elements.height.value);if(['distance','source'].includes(e.target.name))f.elements.confirmed.checked=false;draw();});
for(const [id,key] of [['pointA','a'],['pointB','b'],['origin','origin']])bind('#'+id,'click',()=>{mode=key;$('#calHelp').textContent='Jetzt den gewünschten Punkt direkt auf der Vorlage antippen.';});
bind('#clearBackground','click',()=>{delete p.backgrounds[f.elements.side.value];reset();});bind('#useBackgroundAsMotif','click',async()=>{const side=f.elements.side.value,src=p.backgrounds[side];if(!src)return;const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Bild kann nicht als Motiv geöffnet werden.'));img.src=src;});p.src=src;p.pixels=[img.naturalWidth,img.naturalHeight];ratio=img.naturalWidth/img.naturalHeight;f.elements.name.value=f.elements.name.value||'Motiv';f.elements.height.value=(Number(f.elements.width.value)/ratio).toFixed(1);delete p.backgrounds[side];reset();$('#uploadStatus').textContent='Bild als Druckmotiv übernommen. Breite und Position jetzt anpassen.';});bind('#backgroundFile','change',async e=>{const file=e.target.files[0];if(!file)return;const side=f.elements.side.value;p.backgrounds[side]=await imageData(file);reset();});
bind('#motifFile','change',async e=>{const file=e.target.files[0];if(!file)return;loading=true;$('#uploadStatus').textContent='Bild wird geladen …';try{const src=await imageData(file);const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Das Bild ist beschädigt oder kann nicht angezeigt werden. Bitte als PNG oder JPG neu speichern.'));img.src=src;});p.src=src;p.pixels=[img.naturalWidth,img.naturalHeight];ratio=img.naturalWidth/img.naturalHeight;f.elements.name.value=file.name;f.elements.height.value=(Number(f.elements.width.value)/ratio).toFixed(1);draw();$('#uploadStatus').textContent='Geladen: '+file.name;}catch(error){$('#uploadStatus').textContent=error.message;throw error;}finally{loading=false;e.target.value='';}});

const point=e=>new DOMPoint(e.clientX,e.clientY).matrixTransform(stage.getScreenCTM().inverse());stage.addEventListener('pointerdown',e=>{const pt=point(e);if(mode){p.calibration||={};p.calibration[mode]={x:pt.x,y:pt.y};f.elements.confirmed.checked=false;mode=null;$('#calHelp').textContent='Punkt gesetzt. Abstand in mm und Maßquelle eintragen.';draw();return;}if(e.target.id!=='motif')return;drag={px:pt.x,py:pt.y,x:p.x,y:p.y,k:placementScale(p)||.4};stage.setPointerCapture(e.pointerId);});stage.addEventListener('pointermove',e=>{if(!drag)return;const pt=point(e);for(const [n,v] of [['x',drag.x+(pt.x-drag.px)/drag.k],['y',drag.y+(pt.y-drag.py)/drag.k]])f.elements[n].value=(Math.max(-1500,Math.min(1500,v))).toFixed(1);draw();});for(const ev of ['pointerup','pointercancel'])stage.addEventListener(ev,()=>drag=null);
const persist=async duplicate=>{if(loading)throw Error('Bitte warten, bis das Bild vollständig geladen ist.');read();if(!f.reportValidity())return;if(!p.src)throw Error('Transferdatei laden.');if(!p.lineId)throw Error('Textilposition mit Modell und Größe zuordnen.');if(p.calibration?.confirmed&&(!placementScale(p)||!p.calibration.source.trim()))throw Error('Für den bestätigten Maßstab Punkte, Abstand, Nullpunkt und Maßquelle vervollständigen.');p.needsReview=false;if(duplicate){p.id=uid();o.placements.push(p);}else if(old)o.placements[o.placements.indexOf(old)]=p;else o.placements.push(p);await save();$('#modal').close();render();};bind('#placementForm','submit',async e=>{e.preventDefault();await persist(false);});bind('#duplicatePlacement','click',()=>persist(true));bind('#removePlacement','click',async()=>{if(!confirm('Platzierung entfernen?'))return;o.placements=o.placements.filter(x=>x.id!==id);await save();$('#modal').close();render();});draw();});}

function designSourceSelect(o,targetId){const sources=o.lines.filter(l=>l.id!==targetId&&o.placements.some(p=>p.lineId===l.id));if(!sources.length||o.placements.some(p=>p.lineId===targetId))return '';return select('designSource','Motive für diesen Artikel übernehmen',[['','Keine Motive übernehmen'],...sources.map(l=>[l.id,[l.description,l.model,l.color,l.size].filter(Boolean).join(' · ')+' ('+o.placements.filter(p=>p.lineId===l.id).length+' Motive)'])],sources[0].id)+'<p class="sub">Die vorhandenen Motive werden auf die neue Textilposition übertragen. Brust und Rücken erhöhen so jeweils ihre Druckmenge um die neue Stückzahl. Position und Maßstab am neuen Textil prüfen.</p>';}
function copyDesign(o,sourceId,targetId){if(!sourceId)return 0;const source=o.placements.filter(p=>p.lineId===sourceId),target=o.lines.find(l=>l.id===targetId);if(!target||!source.length||o.placements.some(p=>p.lineId===targetId))return 0;for(const p of source)o.placements.push({...structuredClone(p),id:uid(),lineId:targetId,calibration:null,backgrounds:{},needsReview:true});target.transfersPerItem=source.length;return source.length;}
function industryPreview(l,o){const copy=structuredClone(l);Core.reprice([...structuredClone(o.lines.filter(x=>x.id!==l.id)),copy]);return copy;}
function matchingIndustry(l){const matches=state.catalog.filter(r=>r.model===String(l.model).padStart(4,'0')&&r.colors.includes(l.color)&&r.sizes.includes(l.size)&&Object.keys(r.industry||{}).length);if(l.maker!=='HAKRO'||matches.length!==1)throw Error('Keine eindeutige HAKRO-Preiszeile für Modell, Farbe und Größe. Bitte aus dem Katalog auswählen.');return matches[0];}
function setupIndustryForm(l,o){const f=$('#lineForm');

const update=()=>{if(l.manualVk!==false)return;const row=current();if(['maker','model','color','size'].some(k=>row[k]!==l[k])){l.manualVk=true;$('#vkSource').textContent='Variante geändert: Preisquelle neu zuordnen oder VK manuell festlegen.';return;}const value=industryPreview(row,o);f.elements.vk.value=amount(Sales.gross(value));$('#vkSource').textContent=value.vk===null?'Keine passende Industriestaffel: VK manuell eingeben oder Menge erhöhen.':`Automatischer Brutto-VK · Industriepreis ab ${value.vkTier} Stück · ${l.vkSource||l.source||''}, Zeile ${l.vkSourceRow||l.sourceRow||''}`;};

f.elements.vk.addEventListener('input',()=>{l.manualVk=true;$('#vkSource').textContent='Manueller Brutto-VK: bleibt bei Mengenänderungen erhalten.';});for(const n of ['qty','maker','model','color','size','tax'])f.elements[n].addEventListener('input',update);update();}
function pickVariant(r){$('#modal').close();modal({title:`${esc(r.model)} ${esc(r.name)}`,body:`<form id="variantForm"><div class="grid">${select('color','Farbcode',r.colors,r.colors[0])}${select('size','Größe',r.sizes,r.sizes[0])}${input('qty','Stückzahl',1,'number','min="1" max="100000" required')}${input('transfersPerItem','Transfers je Textil (0 = unveredelt)',1,'number','min="0" max="100" required step="1"')}${input('vk','VK brutto (€) – automatisch oder manuell; darf zunächst offen bleiben','','text','inputmode="decimal"')}${Object.keys(r.prices||{}).length?'':input('ek','EK netto (€) – Händlerliste fehlt, manuell eintragen','','text','required inputmode="decimal"')}${select('tax','Mehrwertsteuer',[['','Bitte auswählen'],[7,'7 %'],[19,'19 %']],7)}</div>${designSourceSelect(order(),null)}<p id="vkSource" class="notice"></p>${button('useIndustry','Industriepreis wieder übernehmen')}<p class="sub">${Object.keys(r.prices||{}).length?'EK aus Händlerliste':'Kein Händler-EK importiert: manueller EK netto nötig.'} Quelle: ${esc(r.source)}, EU, Zeile ${r.row}. Die Staffel zählt alle Positionen mit gleichem Modell, gleicher Farbe und gleicher Größe in diesem Auftrag. EK bleibt getrennt.</p><button class="primary">In Auftrag übernehmen</button></form>`},()=>{const f=$('#variantForm'),lineId=uid();let manual=false;

f.elements.vk.addEventListener('input',()=>{manual=true;$('#vkSource').textContent='Manueller Brutto-VK: bleibt bei Mengenänderungen erhalten.';});for(const n of ['qty','color','size','tax'])f.elements[n].addEventListener('input',update);bind('#useIndustry','click',()=>{manual=false;update();});
bind('#variantForm','submit',async e=>{e.preventDefault();const data=formData(f),tax=Number(data.tax);if(![7,19].includes(tax))throw Error('Steuersatz auswählen.');const missingEk=!Object.keys(r.prices||{}).length;if(missingEk&&!data.ek?.trim())throw Error('Händler-EK fehlt. EK netto manuell eintragen oder Händlerliste importieren.');const per=Number(data.transfersPerItem);if(!Number.isInteger(per)||per<0||per>100)throw Error('Transfers je Textil prüfen.');const l={...line(),transfersPerItem:per,description:r.name,vk:data.vk.trim()?Core.cents(data.vk):null,manualVk:manual&&!!data.vk.trim(),tax,ek:missingEk?Core.cents(data.ek):0,prices:structuredClone(r.prices||{}),manualEk:missingEk,source:r.source,sourceRow:r.row,vkSource:r.source,vkSourceRow:r.row};if(order().applicationMode===undefined&&!order().lines.some(x=>x.kind==='application'))order().applicationMode='auto';order().lines.push(l);copyDesign(order(),data.designSource,l.id);Core.reprice(order().lines);await save();$('#modal').close();view='orders';render();toast((l.vk==null?'Artikel mit offenem VK übernommen. Vor einem Angebot Preis festlegen. ':'Artikel übernommen: ')+r.model+' · '+l.color+' · '+l.size+' · '+l.qty+' Stück');});update();});}

function transferCount(o){return o.lines.filter(l=>l.kind!=='application').reduce((sum,l)=>{const placements=o.placements.filter(p=>p.lineId===l.id).length;const each=placements||Number(l.transfersPerItem??(l.maker==='HAKRO'?1:0));if(!Number.isInteger(each)||each<0||each>100)throw Error('Transfers je Textil: ganze Zahl von 0 bis 100.');return sum+l.qty*each;},0);}
function syncApplication(o){if(o.salesVersion===2){syncCommercial(o);return;}if(o.applicationMode!=='auto')return;const qty=transferCount(o),old=o.lines.find(l=>l.kind==='application');if(!qty){o.lines=o.lines.filter(l=>l.kind!=='application');return;}Core.qty(qty);const r=o.applicationRates||{threshold:50,low:450,high:400,tax:7};o.applicationRates=r;const line={id:old?.id||uid(),kind:'application',description:'Transfers aufbringen',maker:'',model:'',color:'',size:'',qty,ek:old?.ek||0,vk:applicationPrice(qty,r),tax:r.tax,manualEk:true,autoApplication:true};o.lines=o.lines.filter(l=>l.kind!=='application');o.lines.push(line);}
function serviceEditor(){return commercialEditor();}
function legacyServiceEditor(){if(order().salesVersion===2){commercialEditor();return;}const o=order(),old=o.lines.find(l=>l.kind==='application'),r=o.applicationRates||{threshold:50,low:450,high:400,tax:7},suggested=transferCount(o);modal({title:'Transfers aufbringen',body:`<form id="serviceForm"><label><input name="auto" type="checkbox" ${o.applicationMode==='auto'||!old?'checked':''}> Automatisch aus Textilien und Platzierungen berechnen</label><p>Je Textil zählt die Anzahl zugeordneter Motive. Ohne Motiv zählt das Feld „Transfers je Textil“ (bei HAKRO zunächst 1; für unveredelte Artikel 0 eintragen).</p>${input('qty','Anzahl aufgebrachter Transfers',old?.qty||suggested||1,'number','min="1" max="100000" required')}<p>Automatisch errechnet: ${suggested} Aufbringungen.</p>${button('standardRates','Vereinbarte Staffel wiederherstellen (ab 50)')}<div class="grid">${input('threshold','Günstigerer Preis ab Anzahl',r.threshold,'number','min="1" required')}${input('low','VK netto unter dieser Grenze (€)',amount(r.low),'text','required inputmode="decimal"')}${input('high','VK netto ab dieser Grenze (€)',amount(r.high),'text','required inputmode="decimal"')}${select('tax','MwSt.',[[7,'7 %'],[19,'19 %']],r.tax)}</div><p id="serviceSum"></p><button class="primary">Übernehmen</button>${old?button('removeService','Dienstleistung entfernen','danger'):''}</form>`},()=>{const f=$('#serviceForm');const read=()=>({qty:f.elements.auto.checked?suggested:Core.qty(f.elements.qty.value),rates:{threshold:Core.qty(f.elements.threshold.value),low:Core.cents(f.elements.low.value),high:Core.cents(f.elements.high.value),tax:Number(f.elements.tax.value)}});const preview=()=>{f.elements.qty.readOnly=f.elements.auto.checked;f.elements.qty.min=f.elements.auto.checked?0:1;if(f.elements.auto.checked)f.elements.qty.value=suggested;try{const v=read();$('#serviceSum').textContent=v.qty?`${v.qty} × ${euro(applicationPrice(v.qty,v.rates))} = ${euro(v.qty*applicationPrice(v.qty,v.rates))} netto`:'Keine Aufbringungen. Bei Textilien Transfers je Textil eintragen.';}catch{$('#serviceSum').textContent='Bitte Eingaben prüfen.';}};f.addEventListener('input',preview);bind('#standardRates','click',()=>{f.elements.threshold.value=50;f.elements.low.value='4.50';f.elements.high.value='4.00';f.elements.tax.value='7';preview();});bind('#serviceForm','submit',async e=>{e.preventDefault();const v=read();o.applicationRates=v.rates;o.applicationMode=f.elements.auto.checked?'auto':'manual';if(o.applicationMode==='auto')syncApplication(o);else{const l={id:old?.id||uid(),kind:'application',description:'Transfers aufbringen',maker:'',model:'',color:'',size:'',qty:v.qty,ek:old?.ek||0,vk:applicationPrice(v.qty,v.rates),tax:v.rates.tax,manualEk:true};o.lines=o.lines.filter(l=>l.kind!=='application');o.lines.push(l);}await save();$('#modal').close();render();});bind('#removeService','click',async()=>{o.applicationMode='off';o.lines=o.lines.filter(l=>l.kind!=='application');await save();$('#modal').close();render();});preview();});}

function syncCommercial(o){if(o.salesVersion!==2)return;const previous=o.transferJobs||[];const standalone=previous.filter(j=>!j.placementId);o.transferJobs=[...standalone,...o.placements.map(p=>{const old=previous.find(j=>j.placementId===p.id);return {...old,id:'p-'+p.id,placementId:p.id,motifId:p.src||p.id,name:p.name,width:p.width,height:p.height,lineId:p.lineId,perItem:1,qty:1,apply:old?.apply??true};})];const result=Sales.calculate(o);o.lines=[...o.lines.filter(l=>!l.salesGenerated),...result.lines];}
function commercialEditor(){const o=order();if(o.salesVersion!==2){if(!confirm('Neue Bruttokalkulation für diesen Auftrag aktivieren? Bisherigen Stand vorher sichern. Alte Aufbringpositionen werden ersetzt; gespeicherte Dokumente bleiben erhalten.'))return;o.beforeSales=structuredClone({lines:o.lines,applicationRates:o.applicationRates,applicationMode:o.applicationMode});o.lines=o.lines.filter(l=>l.kind!=='application');o.salesVersion=2;o.applicationMode='off';o.salesTax=7;}
syncCommercial(o);modal({title:'Transferdruck und Aufbringen · Bruttopreise',body:`<p>Zu platzierte Motive zählen automatisch mit der Menge ihrer Textilposition. Identische Bilddatei und Druckgröße bilden eine Druckstaffel, unabhängig von Textilfarbe und -größe. Gleiche Datei erneut laden, wenn dasselbe Motiv mehrfach verwendet wird.</p><div class="row">${button('newPrintJob','Nur Transfers / Kundentextil')}${button('newMeterJob','Meterware')}</div><p>Bei „Kundentextil“ wird die Stückzahl direkt eingetragen. Textilansichten können weiterhin über eine kostenlose Textilposition und Motivplatzierung angelegt werden.</p><div>${o.transferJobs.map(j=>`<div class="card"><strong>${esc(j.name)}</strong><p>${j.width} × ${j.height} mm · ${j.lineId?'Menge aus Textilposition':j.qty+' Stück'} · ${j.apply?'mit Aufbringen':'nur Druck'}</p><button data-job="${esc(j.id)}">Druck / Aufbringen bearbeiten</button></div>`).join('')}</div>${(o.meterJobs||[]).map(m=>`<p>${m.qty} lfm Meterware <button data-meter="${m.id}">Bearbeiten</button></p>`).join('')}<form id="salesConfig">${select('tax','MwSt. für Transferdruck, Aufbringen und Zuschläge',[[7,'7 %'],[19,'19 %']],o.salesTax??7)}<h3>Transfers aufbringen</h3><p id="pressPreview" class="notice" role="status"></p><label><input name="pressOverride" type="checkbox" ${o.pressManualPrice!=null?'checked':''}> Abweichenden Stückpreis bewusst verwenden</label>${input('pressPrice','Sonderpreis brutto je Transfer (€)',o.pressManualPrice==null?'':amount(o.pressManualPrice),'text','inputmode="decimal"')}${button('resetPressPrice','Aktuelle Bruttostaffel verwenden')}<p>Aufbringen: 1–10: 4,00 €; 11–50: 3,50 €; 51–100: 3,25 €; 101–200: 3,00 €. Über 200: manuellen Preis bestätigen. Unter 50 € Transferwarenwert einschließlich Meterware: einmalig 10 € Pauschale.</p><button class="primary">Kalkulation speichern</button></form>`},()=>{const config=$('#salesConfig');const preview=()=>{config.elements.pressPrice.disabled=!config.elements.pressOverride.checked;try{const value=config.elements.pressOverride.checked?Core.cents(config.elements.pressPrice.value):null;const copy={...o,pressManualPrice:value};const line=Sales.calculate(copy).lines.find(l=>l.kind==='application');$('#pressPreview').textContent=line?(line.vk==null?line.qty+' Transfers: Preis auf Anfrage':line.qty+' Transfers × '+euro(line.vk)+' = '+euro(line.qty*line.vk)+' brutto · '+(value==null?'Bruttostaffel':'Manueller Sonderpreis')):'Keine Aufbringungen. Textilien oder Transferaufträge mit Aufbringen anlegen.';}catch{$('#pressPreview').textContent='Bitte einen gültigen Brutto-Stückpreis eingeben.';}};config.addEventListener('input',preview);bind('#resetPressPrice','click',()=>{config.elements.pressOverride.checked=false;config.elements.pressPrice.value='';preview();});preview();bind('#newPrintJob','click',()=>printJobEditor());bind('#newMeterJob','click',()=>meterEditor());document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>printJobEditor(b.dataset.job));document.querySelectorAll('[data-meter]').forEach(b=>b.onclick=()=>meterEditor(b.dataset.meter));bind('#salesConfig','submit',async e=>{e.preventDefault();const f=formData(e.target);o.salesTax=Number(f.tax);o.pressManualPrice=e.target.elements.pressOverride.checked?Core.cents(f.pressPrice):null;syncCommercial(o);await save();$('#modal').close();render();});});}
function printJobEditor(id){const o=order(),old=o.transferJobs?.find(j=>j.id===id),j=structuredClone(old||{id:uid(),name:'',motifId:'',width:100,height:50,qty:1,apply:false,doublePress:false,manualPrice:null});modal({title:'Transferdruck kalkulieren',body:`<form id="printJobForm">${input('name','Motivname',j.name,'text','required')}${j.placementId?'<p>Maße und Textilmenge werden aus der Motivplatzierung übernommen.</p>':`<label>Motivdatei (gleiche Datei = gleiche Motivgruppe)<input id="jobFile" type="file" accept=".png,.jpg,.jpeg,.webp"></label><div class="grid">${input('width','Fertige Breite mm',j.width,'number','required min="0.1" step="0.1"')}${input('height','Fertige Höhe mm',j.height,'number','required min="0.1" step="0.1"')}${input('qty','Stückzahl',j.qty,'number','required min="1" max="100000" step="1"')}</div>`}<label><input name="apply" type="checkbox" ${j.apply?'checked':''}> Zusätzlich aufbringen</label><label><input name="doublePress" type="checkbox" ${j.doublePress?'checked':''}> XL benötigt zwei Pressvorgänge (+0,50 € brutto je Stück)</label>${input('manualPrice','Manueller Druckpreis brutto je Stück (leer = Staffel)',j.manualPrice==null?'':amount(j.manualPrice),'text','inputmode="decimal"')}<p>Manuelle Preise gelten für diese Zuordnung. Über 200 Stück oder über 1.250 cm² ist ein bestätigter manueller Preis erforderlich.</p><button class="primary">Übernehmen</button>${old&&!j.placementId?button('removePrintJob','Entfernen','danger'):''}</form>`},()=>{bind('#jobFile','change',async e=>{if(e.target.files[0]){j.motifId=await imageData(e.target.files[0]);$('#printJobForm').elements.name.value=e.target.files[0].name;}});bind('#printJobForm','submit',async e=>{e.preventDefault();const f=formData(e.target);j.name=f.name;if(!j.placementId){j.width=Number(f.width);j.height=Number(f.height);j.qty=Core.qty(f.qty);if(!j.motifId)throw Error('Motivdatei laden.');Sales.size(j.width,j.height);}j.apply=e.target.elements.apply.checked;j.doublePress=e.target.elements.doublePress.checked;if(j.doublePress&&(!j.apply||Sales.size(j.width,j.height)!=='XL'))throw Error('Zuschlag nur für XL mit Aufbringen.');j.manualPrice=f.manualPrice.trim()?Core.cents(f.manualPrice):null;o.transferJobs||=[];if(old)o.transferJobs[o.transferJobs.indexOf(old)]=j;else o.transferJobs.push(j);syncCommercial(o);await save();commercialEditor();});bind('#removePrintJob','click',async()=>{o.transferJobs=o.transferJobs.filter(x=>x.id!==id);syncCommercial(o);await save();commercialEditor();});});}
function meterEditor(id){const o=order(),old=o.meterJobs?.find(m=>m.id===id);modal({title:'Meterware · 46 cm Rollenbreite',body:`<form id="meterForm">${input('qty','Laufmeter (mindestens 2)',old?.qty||2,'number','min="2" max="100000" step="0.01" required')}<p>11,00 € brutto je lfm. Keine zusätzliche Stückabrechnung für dieselben Transfers anlegen.</p><button class="primary">Übernehmen</button>${old?button('removeMeter','Entfernen','danger'):''}</form>`},()=>{bind('#meterForm','submit',async e=>{e.preventDefault();const qty=Number(e.target.elements.qty.value);if(!Number.isFinite(qty)||qty<2)throw Error('Mindestens 2 lfm.');o.meterJobs||=[];const m={id:old?.id||uid(),qty};if(old)o.meterJobs[o.meterJobs.indexOf(old)]=m;else o.meterJobs.push(m);syncCommercial(o);await save();commercialEditor();});bind('#removeMeter','click',async()=>{o.meterJobs=o.meterJobs.filter(x=>x.id!==id);syncCommercial(o);await save();commercialEditor();});});}

function standaloneTransferPages(o){return (o.transferJobs||[]).filter(j=>!j.placementId).map(j=>`<section class="placement" style="break-before:page"><h2>Transfermotiv: ${esc(j.name)}</h2><img src="${esc(j.motifId)}" alt="Transfermotiv" style="max-width:100%;max-height:300px"><p>Fertige Größe: ${j.width} × ${j.height} mm · ${j.qty} Stück · ${j.apply?'mit Aufbringen auf Kundentextil':'nur Transferlieferung'}</p><p>Motivansicht verkleinert, kein 1:1-Ausdruck. ${j.apply?'Platzierung am Kundentextil separat festlegen.':''}</p></section>`).join('');}
</script></body></html>
