:root{--navy:#173749;--teal:#126d70;--green:#bcdbb2;--bg:#f1f4f1;--line:#d7e1dc}*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--navy)}header{background:var(--navy);color:white;padding:18px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px}header strong{font-size:24px}header small{display:block;color:#cee0dc}nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 28px;background:white;border-bottom:1px solid var(--line)}button,.button{border:1px solid #9eb9b2;border-radius:7px;padding:10px 16px;color:var(--navy);background:white;font:inherit;cursor:pointer}button:hover{background:#e1eee8}button.primary,button.active{background:var(--teal);color:white;border-color:var(--teal)}button.danger{color:#9b3232}button:disabled{opacity:.5;cursor:default}main{max-width:1300px;margin:auto;padding:24px}.card{background:white;padding:24px;border-radius:12px;border:1px solid var(--line);margin-bottom:18px}h1,h2,h3{line-height:1.2;margin-top:0}h1{font-size:30px}h2{font-size:23px}label{display:block;font-size:14px;font-weight:600;margin:10px 0}input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid #b3c5bd;border-radius:6px;background:white;color:#172f3c;min-height:44px}textarea{min-height:90px}input[type=checkbox]{width:auto;min-height:0}input[type=file]{font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between}.sub{color:#4c675f;font-size:14px}.notice{padding:14px;background:#fff4d8;border-left:4px solid #c89428;margin:14px 0}.badge{display:inline-block;background:#e5efe7;border-radius:20px;padding:3px 12px;font-size:13px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#edf3ef}td input{min-width:80px}#toast{positi
