<style>

  h1{ margin:0; font-size:1.6rem; }
  a.knopf{ display:flex; align-items:center; justify-content:center; min-height:4.2rem; padding:.6rem 1rem;

  a.leise{ color:var(--accent); }
  :focus-visible{ outline:.25rem solid var(--fokus); outline-offset:.15rem; box-shadow:0 0 0 .4rem var(--ink); }
