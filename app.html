<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrintGo — Pro DTF & Paper Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #F1F5F9; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased">

    <!-- Header -->
    <header class="border-b border-slate-800/80 px-6 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="font-black text-2xl tracking-tight text-white">PrintGo</span>
                <span class="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs px-2.5 py-0.5 rounded-full font-semibold">Pro Engine</span>
            </div>
            <div class="text-xs text-slate-500 font-mono">300 DPI · Auto-Preflight</div>
        </div>
    </header>

    <!-- Main App -->
    <main class="max-w-3xl mx-auto px-6 pt-12 pb-20 text-center">
        
        <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-white mb-4">
            DTF & Print Preflight <br>
            <span class="text-slate-400 font-normal">Perfekte Druckdaten in Sekunden</span>
        </h1>
        <p class="text-slate-400 text-sm sm:text-base mb-8">
            Lädt Bilder hoch, entfernt unsaubere Ränder, prüft Transparenz und skaliert verlustfrei auf exakt 300 DPI.
        </p>

        <!-- Mode Toggle -->
        <div class="inline-flex p-1 bg-slate-900 border border-slate-800 rounded-xl mb-8">
            <button id="btn-dtf" onclick="setMode('dtf')" class="px-6 py-2.5 rounded-lg text-sm font-semibold transition bg-white text-black shadow-md">
                DTF Film (Hard Alpha & Margin)
            </button>
            <button id="btn-paper" onclick="setMode('paper')" class="px-6 py-2.5 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white">
                Papier / Poster (300 DPI)
            </button>
        </div>

        <!-- Dropzone -->
        <div onclick="document.getElementById('file-input').click()" 
             class="border-2 border-dashed border-slate-800 hover:border-emerald-500/50 bg-slate-900/40 rounded-2xl p-8 sm:p-12 transition text-center cursor-pointer relative">
            
            <input type="file" id="file-input" accept="image/png, image/jpeg, image/webp" class="hidden" onchange="handleFileSelect(event)">
            
            <div id="upload-label" class="space-y-3">
                <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center mx-auto border border-slate-700 text-emerald-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                </div>
                <p id="file-name" class="text-base font-semibold text-slate-200">Klicke zum Auswählen oder Bild hierher ziehen</p>
                <p class="text-xs text-slate-500 font-mono">PNG, JPG oder WebP</p>
            </div>
        </div>

        <!-- Action Button -->
        <div id="action-box" class="hidden mt-6">
            <button onclick="processAndDownload()" class="w-full py-4 bg-emerald-500 hover:bg-emerald-400 text-black font-bold rounded-xl transition shadow-lg text-base">
                <span id="btn-status">Druckfertige Datei verarbeiten & herunterladen</span>
            </button>
        </div>

    </main>

    <canvas id="canvas" class="hidden"></canvas>

    <script>
        let selectedFile = null;
        let mode = 'dtf';

        function setMode(m) {
            mode = m;
            document.getElementById('btn-dtf').className = m === 'dtf' 
                ? 'px-6 py-2.5 rounded-lg text-sm font-semibold transition bg-white text-black shadow-md'
                : 'px-6 py-2.5 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white';
            document.getElementById('btn-paper').className = m === 'paper' 
                ? 'px-6 py-2.5 rounded-lg text-sm font-semibold transition bg-white text-black shadow-md'
                : 'px-6 py-2.5 rounded-lg text-sm font-semibold transition text-slate-400 hover:text-white';
        }

        function handleFileSelect(e) {
            if (e.target.files && e.target.files[0]) {
                selectedFile = e.target.files[0];
                document.getElementById('file-name').textContent = selectedFile.name;
                document.getElementById('action-box').classList.remove('hidden');
            }
        }

        function processAndDownload() {
            if (!selectedFile) return;

            const btnStatus = document.getElementById('btn-status');
            btnStatus.textContent = 'Verarbeite 300 DPI Preflight...';

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('canvas');
                    const ctx = canvas.getContext('2d');

                    // 2x Scaler auf 300 DPI Zielauflösung
                    canvas.width = img.width * 2;
                    canvas.height = img.height * 2;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    if (mode === 'dtf') {
                        // Alpha Hard Thresholding gegen schmutzige Kleberänder
                        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const d = imgData.data;
                        for (let i = 3; i < d.length; i += 4) {
                            if (d[i] < 20) d[i] = 0;
                            else d[i] = 255;
                        }
                        ctx.putImageData(imgData, 0, 0);
                    }

                    const url = canvas.toDataURL('image/png');
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = mode === 'dtf' ? 'dtf-ready-300dpi.png' : 'paper-ready-300dpi.png';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();

                    btnStatus.textContent = 'Erfolgreich heruntergeladen!';
                    setTimeout(() => { btnStatus.textContent = 'Erneut verarbeiten'; }, 2000);
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(selectedFile);
        }
    </script>
</body>
</html>
